substitutions:
  _AR_HOSTNAME: europe-west1-docker.pkg.dev
  _AR_PROJECT_ID: magnifinder-508118
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: europe-west1
  _SERVICE_NAME: magnifinder-backend-git
  _TRIGGER_ID: b2209a95-24ff-4d84-8283-6d6681fdb5af
  _REPO_NAME: wellnesswizard-org-magnifinder_backend
  _FRONTEND_URL: https://magnifinder.vercel.app
  _ALLOWED_ORIGINS: https://magnifinder.vercel.app
  _GOOGLE_OAUTH_REDIRECT_URI: https://magnifinder-backend-git-xyz-ew.a.run.app/api/v1/identity/google/callback

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_DEPLOY_REGION}
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,FRONTEND_URL=${_FRONTEND_URL},ALLOWED_ORIGINS=${_ALLOWED_ORIGINS},GOOGLE_OAUTH_REDIRECT_URI=${_GOOGLE_OAUTH_REDIRECT_URI}
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,BETTERCONTACT_API_KEY=BETTERCONTACT_API_KEY:latest

images:
  - ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
